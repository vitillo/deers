[package]
name = "deers"
version = "0.1.0"
edition = "2024"
description = "A minimal deep learning framework in Rust, built for understanding"
license = "MIT"
repository = "https://github.com/vitillo/deers"
authors = ["Roberto Vitillo <ra.vitillo@gmail.com>"]

[features]
default = []
cuda = ["dep:cutile", "dep:cuda-core", "dep:cuda-async", "dep:cudarc"]

[dependencies]
thiserror = "2.0.18"
rand = "0.10"
gemm = "0.19.0"
half = "2.7.1"
tiktoken-rs = "0.9"
ureq = "3"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
cutile = { version = "0.4.0", optional = true }
cuda-core = { version = "0.4.0", optional = true }
cuda-async = { version = "0.4.0", optional = true }
cudarc = { version = "0.19.10", optional = true, default-features = false, features = ["std", "driver", "cublas", "f16", "cuda-version-from-build-system", "dynamic-linking"] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33.0"

[dev-dependencies]
candle-core = "0.9.2"
candle-nn = "0.9.2"
candle-transformers = "0.9.2"
tokenizers = "0.23"

[target.'cfg(target_os = "linux")'.dev-dependencies]
candle-core = { version = "0.9.2", features = ["cuda"] }
candle-nn = { version = "0.9.2", features = ["cuda"] }
candle-transformers = { version = "0.9.2", features = ["cuda"] }

[profile.release]
debug = true

# cuTile uses its compiler crate's Cargo debug setting to choose device codegen.
# Keep host symbols, but avoid unoptimized CUDA kernels in release builds.
[profile.release.package.cutile-compiler]
debug = false

[lints.clippy]
# Match AGENTS.md: treat Clippy warnings as errors (same as `clippy … -D warnings`).
all = { level = "deny", priority = -1 }
too_many_arguments = "allow"
enum_variant_names = "allow"
needless_borrow = "allow"
manual_div_ceil = "allow"
unnecessary_cast = "allow"
